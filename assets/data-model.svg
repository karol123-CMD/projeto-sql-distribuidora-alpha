<text x="60" y="940" class="sub">PK: chave primária</text><text x="60" y="976" class="sub">FK: chave estrangeira</text><text x="60" y="1012" class="sub">UQ: vínculo único na tabela</text><text x="60" y="1258" class="sub">Cada registro filho referencia exatamente um pai. Um pai pode ter zero ou vários filhos (0..N).</text><text x="60" y="1292" class="sub">Nos vínculos únicos com endereço, o máximo é um filho por tabela (0..1). Demais atributos: sql/01_schema.sql.</text></svg>